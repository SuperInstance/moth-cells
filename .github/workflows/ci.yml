name: ci

on:
  push:
    branches: [main, "**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e . pytest
      - name: Test
        run: python -m pytest
      - name: Demo walk end-to-end (receipt gate)
        run: python examples/demo_walk.py
      - name: Committed walk receipt matches a fresh run
        run: |
          python examples/demo_walk.py >/dev/null
          git diff --exit-code -- examples/demo.walk.jsonl \
            || (echo "committed walk receipt is stale: regenerate with examples/demo_walk.py" && exit 1)
      - name: CLI smoke
        run: moth-cells verify examples/demo.walk.jsonl
